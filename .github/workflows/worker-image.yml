# Construit l'image du serveur de tâches et la publie (gratuitement) sur ghcr.io.
# Azure Container Apps la télécharge à chaque exécution : aucun registre payant n'est nécessaire.
# L'image ne contient que du code (jamais de clé : voir .dockerignore).
name: Image du serveur de tâches

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "backend/studoo/**"
      - ".dockerignore"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Construire et publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (en minuscules)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/studoo-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
